<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="source/style.css">
    <title>Hazel's birthday</title>
    
</head>
<body>
    <div id="lockScreen">
        <div class="lock-content">
            <h1>🔒 Locked</h1>
            <p>Swipe or Tap to Open  🎁</p>
            <div id="swipeBar">→ swipe / Tap →</div>
        </div>
    </div>
    <div class="container">
    <div class="confetti-container"></div>

    <div class="balloons">
        🎈🎈🥳🥳🎈🎈🎈✨♥️🎈🎈
    </div>
    
    
    <h1>🎉Happy Birthday Hazel!🥳</h1>
    <div class="message-section">
    <p class="typing"></p>
    </div>
    <div class="slideshow">
        <img id="slideImage" src="images/photo-1.jpeg" alt="slideshow image">
    </div>
    <div class="video-container">
<video controls>
    <source src="video/birthday-video.mp4" type="video/mp4">
</video>
</div>
<div class="final-section">
    <h2>❤️ Us Forever ❤️</h2>
    <img src="images/photo-9.jpeg" alt="Us">
    <p>
        Happy Birthday Hazel🎉<br><br>
        Thank you for being such an important part of my life.<br>
        I hope your day is filled with love, laughter, and everything you want.<br><br>
        You deserve the World❤️
    </p>
    <button id="revealBtn">Open your Suprise✨</button>
</div>
    <script src="JS/app.js"></script>
</div>
</body>
</html>
